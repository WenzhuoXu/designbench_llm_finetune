[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_finetune"
version = "0.1.0"
description = "SFT + GRPO training infrastructure for DesignBench LLMs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.47.0",
    "trl>=0.12.0",
    "accelerate>=1.0.0",
    "deepspeed>=0.15.0",
    "peft>=0.13.0",
    "datasets>=2.20.0",
    "tokenizers>=0.19.0",
    "wandb>=0.18.0",
    "pynvml>=11.5.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "rich>=13.7.0",
    "huggingface_hub>=0.24.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
flash = ["flash-attn>=2.6.0"]
vllm = ["vllm>=0.6.0"]
dev = ["pytest>=8.0", "pytest-cov", "black", "ruff", "ipython"]
all = ["llm_finetune[flash,vllm,dev]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_finetune*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
