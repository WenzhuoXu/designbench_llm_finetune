# §6.3 v2 Step 1a — r_env alone, α=2
# Baseline α sweep: low Lagrange multiplier on feasibility.
# H1b: feasibility_rate should be lowest here (α too small → mass wins over feasibility).

defaults:
  - grpo_truss

reward_fn: composite
reward_weights:
  lagrangian_potential: 1.0     # r_env only: γΦ(s') − Φ(s)

cost_fn: null
use_tree_expansion: false

learning_rate: 5.0e-6           # 10× grpo_base default; needed for LoRA to shift distribution
max_steps_train: 200
num_epochs: 100                 # allow cycling; scheduler uses max_steps_train when > 0
save_steps: 25

posterior:
  alpha: 2.0
  gamma: 0.99
