# P2 (dataxp_grpo_p2_datav4.yaml) started from the collaborator's dx38mtR SFT adapter instead of the base:
# same families, problems file, seed, horizon, group, lr, KL coefficient and step count. Two keys differ,
# both forced by the start:
#   - thinking ON (no --no-think). dx38mtR was trained on a rationale inside the think block, then
#     </think> and the action (target_fn assistant_after_think); the template's generation prompt then
#     ends in '<think>\n', as in its training rows. The harness reads the move after the last </think>.
#   - grpo.kl_reference: init. The leash is to the dx38mtR start (a frozen copy of the adapter), the
#     same relation as P2, whose start and reference were both the base.
# dx38mtR: 24,263 own-action rows (datav4 b001-b023), the eight training families, instruction sha1
# 1c344388a444, multitool spelling, evaluation problems excluded; LoRA r64 / alpha 128 on the same
# Qwen3.8-27B snapshot, lr 1e-4, one epoch (380 steps). init_adapter is a copy of its final/
# (= checkpoint-380, adapter sha256 d7482954023de79d...), outside the collaborator's directory.
#
#   sbatch --export=ALL,RUN_DIR=/project/community/wxu2/rl/runs/<name>,CONFIG=configs/rl/dataxp_grpo_p2_datav4_dx38mtR.yaml,\
#          NVLLM=1,NTRAIN=3,OVERRIDES=grpo.max_turns_per_episode=3 slurm/orchard_dataxp_grpo.sbatch
seed: 0

model:
  path: /project/community/wxu2/rl/hf/hub/models--Qwen--Qwen3.8-27B/snapshots/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
  torch_dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true

policy:
  init_adapter: /project/community/wxu2/rl/inputs/dx38mtR_final
  require_init_adapter: true
  lora:
    r: 64
    lora_alpha: 128
    lora_dropout: 0.0
    target_modules: "model\\.language_model\\.layers\\.\\d+\\.(linear_attn\\.(in_proj_qkv|in_proj_z|in_proj_a|in_proj_b|out_proj)|self_attn\\.(q_proj|k_proj|v_proj|o_proj)|mlp\\.(gate_proj|up_proj|down_proj))"

harness:
  script: /home/wxu2/rl/harness/scripts/dataxp_policy_eval_v3.py
  argv: [--code, /home/wxu2/rl/harness/dataxp_code_v3,
         --native-prompt, served, --instruction-file, /home/wxu2/rl/harness/configs/task_instruction_V2.txt]
  env:
    DX_ORIG_SCRIPTS: /home/wxu2/rl/harness/scripts
    DATAXP_SPELLING: multitool

rollout:
  python: /project/community/wxu2/rl/envs/sim/bin/python
  problems_file: /home/wxu2/rl/problems/train_p2_datav4.jsonl
  variants: [circuit2, frame3d2, grid2, seir2, traffic2, grid2op, engibench, photonics]
  problems_per_step: 8
  group_size: 8
  horizon: 12
  temperature: 0.8
  # no completion cap (max_tokens null): a reply ends at EOS or the context length
  inject: {return_token_ids: true, logprobs: true, top_p: 1.0, top_k: 0, max_tokens: null}
  workers: 64
  keep_full_every: 10

reward:
  speed_bonus: 0.2

grpo:
  steps: 150
  lr: 1.0e-5
  warmup_steps: 3
  kl_coef: 0.04
  kl_reference: init
  iterations: 1
  scale_rewards: group
  max_grad_norm: 1.0

checkpoint:
  keep_last: 2
  keep_adapter_every: 25
  keep_adapter_steps: [50, 150]

guards:
  enabled: true
  window: 5
  parse_drop: 0.10
  kl_increase_max: 0.10
  stall_steps: 30
  stall_kl: 0.005
