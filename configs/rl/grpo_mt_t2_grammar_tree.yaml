# Turn 2 — grammar-protected reward + tree expansion (α=5).
# Combines the Turn-1 grammar fix with the tree variant (best FOS, 2.12).
# Tests whether grammar protection + tree compounds toward higher feasibility.

defaults:
  - grpo_truss

reward_fn: composite
reward_weights:
  lagrangian_potential: 1.0
  tree_advantage: 1.0
  grammar_compliance: 5.0       # protect parseable format

cost_fn: null
use_tree_expansion: true
tree_expansion:
  depth: 1
  branching: 5
  deeper_branching: 3
  continuation: greedy

# ── multi-turn rollout (Turn-1 validated) ───────────────────────────
multi_turn: true
max_turns: 5
max_turn_tokens: 1536
gen_batch_chunk: 8

# ── training ────────────────────────────────────────────────────────
learning_rate: 5.0e-6
max_steps_train: 100
num_epochs: 100
save_steps: 25
group_size: 8
temperature: 0.6
top_p: 0.95

posterior:
  alpha: 5.0
  gamma: 0.99
