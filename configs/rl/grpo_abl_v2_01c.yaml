# §6.3 v2 Step 1c — r_env alone, α=10
# Baseline α sweep: high Lagrange multiplier on feasibility.
# H1b: feasibility_rate highest here; may reduce mass-reduction ability.

defaults:
  - grpo_truss

reward_fn: composite
reward_weights:
  lagrangian_potential: 1.0     # r_env only: γΦ(s') − Φ(s)

cost_fn: null
use_tree_expansion: false

learning_rate: 5.0e-6           # 10× grpo_base default; needed for LoRA to shift distribution
max_steps_train: 200
num_epochs: 100
save_steps: 25

posterior:
  alpha: 10.0
  gamma: 0.99
