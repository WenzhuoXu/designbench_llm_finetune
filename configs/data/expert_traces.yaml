# SFT data configuration — expert trajectories from the model-free search
#
# Generated by scripts/gen_expert.py: the search (tool library + rollout Phi-argmax) solved
# 140 of the 150 discovery-split problems, and every accepted move was translated into
# DesignBench grammar, replayed through the real executor, and kept only where the replay
# itself ended feasible. 140 trajectories, 1,247 assistant turns, 1,107 carrying actions.
#
# Distinct from DesignBench/data/sft/train.jsonl: those traces come from the benchmark's own
# MCTS rollouts, these from a policy that solves 93% of the split it was run on.
#
# Held out from this file: problems 150-580, which every evaluation uses.

data_format: jsonl

train_jsonl: /ocean/projects/mch250030p/wxu7/llm_finetune/data/expert/expert_traces_0_150.jsonl
dev_jsonl: /ocean/projects/mch250030p/wxu7/DesignBench/data/sft/dev.jsonl

# warmstart_reasoning keeps whole compound moves now that _extract_action rejoins every valid
# part; gold_curriculum_warmstart's turn-slicing is aimed at the benchmark's own traces.
target_fn: warmstart_reasoning

# every trajectory in this file ended feasible under the executor, so no quality filter applies
min_trace_quality: 0.0

gold:
  strict_grammar: true
  turn_sliced: false
  include_intermediate_feedback: true

# expert conversations run to 49k characters at the tail; 8192 tokens covers the median 17k
max_seq_len: 16384
